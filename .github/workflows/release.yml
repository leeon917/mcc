name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # 必须：OIDC trusted publishing 用它向 npm 证明仓库身份

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      # trusted publishing 要求 Node >= 22.14
      # 注意：不要设 registry-url —— 它会让 setup-node 写一个带占位 token
      # (XXXXX-XXXXX-XXXXX-XXXXX) 的 .npmrc，npm 会拿这个假 token 去认证而不走 OIDC，必 404。
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      # trusted publishing 要求 npm CLI >= 11.5.1（Node 22 自带的 npm 不够新）
      - run: npm install -g npm@latest

      - run: node -v && npm -v # 确认 publish 用的是 npm >= 11.5.1（OIDC 要求）

      - run: pnpm install --frozen-lockfile

      # 用 npm publish 走 OIDC（pnpm 11 的 OIDC 有已知 404 回归）。
      # trusted publishing 下 provenance 自动生成、也无需 NODE_AUTH_TOKEN；
      # access/provenance 由 package.json 的 publishConfig 控制。
      - run: npm publish
